services:
  lnbits:
    image: lnbits/lnbits:latest
    ports:
      - "5000:5000"
    environment:
      - LNBITS_BACKEND_WALLET_CLASS=LndRestWallet
      - LND_REST_ENDPOINT=https://polar-n3-alice:8080
      - LND_REST_CERT=/certs/tls.cert
      - LND_REST_MACAROON=/certs/admin.macaroon
      - LNBITS_ADMIN_UI=true
      - LNBITS_ALLOW_PUBLIC_ACCOUNT_CREATION=true
      - LNBITS_DATA_FOLDER=/data
      - LNBITS_RESERVE_FEE_MIN=0
      - LNBITS_RESERVE_FEE_PERCENT=0
    volumes:
      - lnbits-data:/data
      - /home/amonoff/.polar/networks/3/volumes/lnd/alice/tls.cert:/certs/tls.cert:ro
      - /home/amonoff/.polar/networks/3/volumes/lnd/alice/data/chain/bitcoin/regtest/admin.macaroon:/certs/admin.macaroon:ro
    networks:
      - polar-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  polar-network:
    name: polar-network-3_default
    external: true

volumes:
  lnbits-data:
    name: ganji_lnbits-data
    external: true
