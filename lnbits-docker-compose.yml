services:
  bitcoind:
    image: ruimarinho/bitcoin-core:28
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - bitcoind-data:/bitcoin
    command: >
      -regtest -fallbackfee=0.0001 -server
      -rpcuser=user -rpcpassword=pass
      -rpcallowip=0.0.0.0/0 -rpcbind=0.0.0.0
      -zmqpubrawblock=tcp://0.0.0.0:28332
      -zmqpubrawtx=tcp://0.0.0.0:28333

  lnd:
    # <-- official LND image (now supports wallet‑unlock flags)
    image: lightninglabs/lnd:v0.21.6-beta
    ports:
      - "10009:10009"
      - "8081:8080"
    volumes:
      - ./password.txt:/root/.lnd/password.txt:ro
      - lnd-data:/root/.lnd
      - ./lnd.conf:/root/.lnd/lnd.conf:ro
    depends_on:
      - bitcoind
    environment:
      - LND_NETWORK=regtest
    command: >-
      --bitcoin.regtest
      --bitcoin.active
      --bitcoin.node=bitcoind
      --bitcoind.rpchost=bitcoind:18443
      --bitcoind.rpcuser=user
      --bitcoind.rpcpass=pass
      --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      --debuglevel=info
      --rpclisten=0.0.0.0:10009
      --restlisten=0.0.0.0:8080
      --tlsextraip=0.0.0.0

  # Test-only second node used to PAY invoices (not needed in production)
  lnd-payer:
    image: lightninglabs/lnd:v0.21.6-beta
    ports:
      - "8082:8080"
    volumes:
      - ./password.txt:/root/.lnd/password.txt:ro
      - lnd-payer-data:/root/.lnd
    depends_on:
      - bitcoind
    command: >-
      --bitcoin.regtest
      --bitcoin.active
      --bitcoin.node=bitcoind
      --bitcoind.rpchost=bitcoind:18443
      --bitcoind.rpcuser=user
      --bitcoind.rpcpass=pass
      --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      --restlisten=0.0.0.0:8080
      --rpclisten=0.0.0.0:10009
      --wallet-unlock-password-file=/root/.lnd/password.txt
      --wallet-unlock-allow-create
      --tlsextraip=0.0.0.0

  lnbits:
    image: lnbits/lnbits:latest
    ports:
      - "5000:5000"
    environment:
      - LNBITS_NETWORK=regtest
      - LNBITS_BACKEND_WALLET_CLASS=LndRestWallet
      - LND_REST_ENDPOINT=https://lnd:8080
      - LND_REST_CERT=/root/.lnd/tls.cert
      - LND_REST_MACAROON=/root/.lnd/data/chain/bitcoin/regtest/admin.macaroon
      - LNBITS_DATA_FOLDER=/data
      - LNBITS_ADMIN_UI=true
      - LNBITS_ALLOW_PUBLIC_ACCOUNT_CREATION=true
      # dev only: let LNbits call webhooks on the host (Gan-ji backend)
      - LNBITS_CALLBACK_URL_RULES=[]
      - LNBITS_CALLBACK_ALLOW_PRIVATE_IPS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lnbits-data:/data
      - ./password.txt:/root/.lnd/password.txt:ro
      - lnd-data:/root/.lnd:ro
    depends_on:
      - lnd

volumes:
  bitcoind-data:
  lnd-data:
  lnbits-data:
  lnd-payer-data: