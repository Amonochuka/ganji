version: '3.8'

services:
  bitcoind:
    image: ruimarinho/bitcoin-core:28
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - bitcoind-data:/bitcoin
    command: >
      -regtest -fallbackfee=0.0001 -server
      -rpcuser=user -rpcpassword=pass
      -rpcallowip=0.0.0.0/0
      -zmqpubrawblock=tcp://0.0.0.0:28332
      -zmqpubrawtx=tcp://0.0.0.0:28333

  lnd:
    image: lightninglabs/lnd:v0.20.5-beta.rc1
    ports:
      - "10009:10009"
      - "8081:8080"
    volumes:
      - lnd-data:/lnd
      - ./lnd.conf:/etc/lnd/lnd.conf
    depends_on:
      - bitcoind
    environment:
      - LND_NETWORK=regtest
    command: --bitcoin.regtest --bitcoin.active --bitcoin.node=bitcoind --bitcoind.rpchost=bitcoind:18443 --bitcoind.rpcuser=user --bitcoind.rpcpass=pass --bitcoind.zmqpubrawblock=tcp://bitcoind:28332 --bitcoind.zmqpubrawtx=tcp://bitcoind:28333 --debuglevel=info --rpclisten=0.0.0.0:10009 --restlisten=0.0.0.0:8080 --tlsextraip=0.0.0.0

  lnbits:
    image: lnbits/lnbits:latest
    ports:
      - "5000:5000"
    environment:
      - LNBITS_NETWORK=regtest
      - LNBITS_BACKEND_WALLET_CLASS=LndRestWallet
      - LND_REST_ENDPOINT=http://lnd:8080
      - LND_REST_CERT=/lnd/tls.cert
      - LND_REST_MACAROON=/lnd/admin.macaroon
      - LNBITS_ADMIN_UI=true
      - LNBITS_ALLOW_PUBLIC_ACCOUNT_CREATION=true
    volumes:
      - lnbits-data:/data
      - lnd-data:/lnd:ro
    depends_on:
      - lnd

volumes:
  bitcoind-data:
  lnd-data:
  lnbits-data: